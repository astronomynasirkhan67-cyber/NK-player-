name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle Wrapper Jar
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.jar.base64 ]; then
            echo "Restoring gradle-wrapper.jar from base64 encoding..."
            base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle Environment
        run: ./gradlew --version

      - name: Restore or generate debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate generated APK
        id: locate-apk
        shell: bash
        run: |
          set -e

          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" \
              -not -path "./.gradle/*" \
              -not -path "./build/*" \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Generated APK not found!"
            find . -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-for-Nasir-Debug-APK
          path: ${{ steps.locate-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
